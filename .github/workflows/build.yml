name: Build APK
on: [push]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y git zip unzip openjdk-17-jdk autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo6 cmake libffi-dev libssl-dev
        python -m pip install --upgrade pip
        pip install --upgrade cython buildozer

    - name: Setup SDK Manager
      run: |
        # 1. 创建 Buildozer 期望的目录
        mkdir -p $HOME/.buildozer/android/platform/android-sdk/tools/bin
        
        # 2. 找到系统中 sdkmanager 的真实路径
        SDK_MANAGER_PATH=$(which sdkmanager)
        echo "系统 sdkmanager 路径: $SDK_MANAGER_PATH"
        
        # 3. 创建软链接，指向真实路径
        ln -sf $SDK_MANAGER_PATH $HOME/.buildozer/android/platform/android-sdk/tools/bin/sdkmanager

    - name: Accept Licenses & Build
      run: |
        # 自动接受所有 Android SDK 许可协议
        yes | buildozer -v android debug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: package
        path: bin/*.apk
