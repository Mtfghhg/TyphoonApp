name: Build APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4g -Dorg.gradle.daemon=false"

    steps:
    - uses: actions/checkout@v4

    - name: Download and Unzip App
      run: |
        wget "https://github.com/Mtfghhg/TyphoonApp/releases/download/v1.0/Typhoon_sim1.3.3.zip" -O app.zip
        unzip -q app.zip -d ./build_dir
        rm app.zip
        MAIN_PATH=$(find ./build_dir -name "main.py" | head -n 1)
        APP_ROOT=$(dirname "$MAIN_PATH")
        echo "APP_ROOT=$APP_ROOT" >> $GITHUB_ENV

    - name: Patch Mobile Main.py
      run: python patch_main.py

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Set up Java 17
      uses: actions/setup-java@v5
      with:
        distribution: 'zulu'
        java-version: '17'

    # 【核心救命魔法】：建立软链接，并补全所有工具
    - name: Fix Android SDK Environment
      run: |
        sudo apt-get update
        sudo apt-get install -y aidl libc6-i386 lib32stdc++6
        
        # 1. 建立传送门，把新路径映射到老路径，骗过 Buildozer
        mkdir -p $ANDROID_HOME/tools/bin
        ln -s $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager $ANDROID_HOME/tools/bin/sdkmanager || true
        ln -s $ANDROID_HOME/cmdline-tools/latest/bin/avdmanager $ANDROID_HOME/tools/bin/avdmanager || true
        
        # 2. 写入许可协议
        echo "24333f8a63b6825ea9c5514f83c2829b004d1fee" > $ANDROID_HOME/licenses/android-sdk-license

    - name: Install Buildozer
      run: |
        pip3 install --user --upgrade buildozer cython virtualenv

    - name: Build with Buildozer
      run: |
        export PATH=$PATH:~/.local/bin
        cd ${{ env.APP_ROOT }}
        cp $GITHUB_WORKSPACE/buildozer.spec .
        # 使用 yes | 强行推进打包，遇到任何询问都回答 y
        yes | buildozer -v android debug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: Typhoon-APK
        path: ./build_dir/**/bin/*.apk
