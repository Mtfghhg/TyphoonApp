name: Build APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: 

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # 使用官方 action，它会自动处理 Flutter SDK、uv 和缓存
      - name: Build APK
        id: build
        uses: flet-dev/flet-build-action@v1
        with:
          target: apk
          # 明确指定 Python 版本，保证环境一致
          runner-python-version: "3.11"
          bundled-python-version: "3.11"
          build-number: ${{ github.run_number }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: ${{ steps.build.outputs.archive-path }}
          if-no-files-found: error
