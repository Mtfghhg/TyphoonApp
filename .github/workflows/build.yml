name: Build APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4g -Dorg.gradle.daemon=false"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev mesa-utils libgl1 libglx-mesa0 xz-utils

      # 【核心欺骗战术】：伪造一个 Android Studio 骗过 flutter doctor
      - name: Fake Android Studio
        run: |
          sudo mkdir -p /opt/android-studio/bin
          echo '#!/bin/bash' | sudo tee /opt/android-studio/bin/studio.sh
          sudo chmod +x /opt/android-studio/bin/studio.sh
          echo "ANDROID_STUDIO_HOME=/opt/android-studio" >> $GITHUB_ENV
          echo "/opt/android-studio/bin" >> $GITHUB_PATH

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.24.0'
          cache: true

      - name: Config Flutter
        run: |
          yes | flutter doctor --android-licenses || true
          flutter config --android-sdk $ANDROID_HOME || true

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build APK
        run: flet build apk -vv --no-rich-output

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/apk/*.apk
          if-no-files-found: error
