name: Build APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 1. 设置 Python 环境
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 2. 设置 Java 环境
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      # 3. 安装 Linux 基础编译依赖
      - name: Install Linux Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev mesa-utils

      # 4. 安装并配置 Flutter
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      # 5. 自动同意安卓协议
      - name: Accept Android Licenses
        run: |
          yes | flutter doctor --android-licenses || true

      # 6. 安装 Python 依赖，强制把 flet 及其路径加入环境
      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # 【核心修复】强行装 flet 并加入环境变量，防止找不到命令
          pip install flet==0.24.1
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      # 7. 开始打包
      - name: Build APK
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          flet build apk --verbose --no-rich-output

      # 8. 上传 APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/apk/*.apk
          if-no-files-found: error
