name: Build APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-android:
    # 【核心更换】：换成最稳定的 Ubuntu 22.04，避开 24.04 的 NDK 和新版 GCC 的坑
    runs-on: ubuntu-22.04
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
      # 注意：这里千万不能写死系统里的 SDK 路径，必须让 Buildozer 自己管
      GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4g -Dorg.gradle.daemon=false"

    steps:
    - uses: actions/checkout@v4

    - name: Download and Unzip App
      run: |
        wget "https://github.com/Mtfghhg/TyphoonApp/releases/download/v1.0/Typhoon_sim1.3.3.zip" -O app.zip
        unzip -q app.zip -d ./build_dir
        rm app.zip
        
        MAIN_PATH=$(find ./build_dir -name "main.py" | grep -v "py/main.py" | head -n 1)
        if [ -z "$MAIN_PATH" ]; then
           MAIN_PATH=$(find ./build_dir -name "main.py" | head -n 1)
        fi
        APP_ROOT=$(dirname "$MAIN_PATH")
        echo "APP_ROOT=$APP_ROOT" >> $GITHUB_ENV
        # 备份原文件
        cp $APP_ROOT/main.py $APP_ROOT/main_bak.py

    - name: Patch Mobile Main.py
      run: python patch_main.py

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Set up Java 17
      uses: actions/setup-java@v5
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y git zip unzip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev cmake libffi-dev libssl-dev aidl libc6-i386 lib32stdc++6
        
    - name: Install Buildozer
      run: |
        pip3 install --user --upgrade buildozer cython virtualenv

    - name: Build with Buildozer
      run: |
        export PATH=$PATH:~/.local/bin
        cd ${{ env.APP_ROOT }}
        cp $GITHUB_WORKSPACE/buildozer.spec .
        cp main_bak.py main.py
        
        # 【核心防坑】：彻底清理旧缓存（特别是如果你之前尝试过的话）
        rm -rf .buildozer
        
        # 开始打包
        yes | buildozer -v android debug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: Typhoon-APK
        path: ./build_dir/**/bin/*.apk
