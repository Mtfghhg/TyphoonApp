name: Build APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-22.04
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
      # 调小一点 Gradle 内存，留给解压和编译
      GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx3g -Dorg.gradle.daemon=false"

    steps:
    - uses: actions/checkout@v4

    # 1. 【核弹级修复】：给服务器强行挂载 6GB 虚拟内存（防冲突版）
    - name: Increase Swap Space
      run: |
        sudo fallocate -l 6G /swapfile_custom || sudo dd if=/dev/zero of=/swapfile_custom bs=1M count=6144
        sudo chmod 600 /swapfile_custom
        sudo mkswap /swapfile_custom
        sudo swapon /swapfile_custom
        # 打印一下内存状态，确认挂载成功
        free -h

    # 2. 下载并解压 600MB 的 .7z 满血包
    - name: Download and Unzip App
      run: |
        wget "https://github.com/Mtfghhg/TyphoonApp/releases/download/v1.1/Typhoon-sim.v1.4.4.7z" -O app.7z
        sudo apt-get update && sudo apt-get install -y p7zip-full
        7z x app.7z -o./build_dir
        rm app.7z
        
        MAIN_PATH=$(find ./build_dir -name "main.py" | head -n 1)
        if [ -z "$MAIN_PATH" ]; then
           MAIN_PATH=$(find ./build_dir -name "main.py" | tail -n 1)
        fi
        APP_ROOT=$(dirname "$MAIN_PATH")
        echo "找到核心目录: $APP_ROOT"
        echo "APP_ROOT=$APP_ROOT" >> $GITHUB_ENV

    # 3. 强行注入“去电脑化 + 手机触摸适配”的启动代码
    - name: Patch Mobile Main.py
      run: |
        cat << 'EOF' > ${{ env.APP_ROOT }}/main.py
        import os
        import sys
        import pygame

        script_dir = os.path.dirname(os.path.abspath(__file__))
        os.chdir(script_dir)
        sys.path.append(script_dir)

        pygame.init()
        try:
            pygame.mixer.set_num_channels(32)
        except pygame.error:
            pass

        import py.constants as constants
        from py.ty_sim import TySim

        def main():
            info = pygame.display.Info()
            sw, sh = info.current_w, info.current_h
            if sw < sh:
                sw, sh = sh, sw

            constants.SW, constants.SH = sw, sh
            constants.MH = sh - getattr(constants, 'CPH', 0)

            screen = pygame.display.set_mode((sw, sh))
            sim = TySim(screen)
            clock = pygame.time.Clock()
            running = True

            while running:
                dt = clock.tick(60) / 1000.0
                for event in pygame.event.get():
                    if event.type == pygame.QUIT:
                        running = False
                    elif event.type == pygame.FINGERDOWN:
                        pos = (event.x * sw, event.y * sh)
                        m_evt = pygame.event.Event(pygame.MOUSEBUTTONDOWN, {'pos': pos, 'button': 1})
                        sim.handle_event(m_evt)
                    elif event.type == pygame.FINGERUP:
                        pos = (event.x * sw, event.y * sh)
                        m_evt = pygame.event.Event(pygame.MOUSEBUTTONUP, {'pos': pos, 'button': 1})
                        sim.handle_event(m_evt)
                    else:
                        sim.handle_event(event)
                        
                sim.update(dt)
                sim.draw(screen)
                pygame.display.flip()

        if __name__ == "__main__":
            main()
        EOF

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Set up Java 17
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    # 4. 补全系统底层编译工具
    - name: Install System Dependencies
      run: |
        sudo apt-get install -y git zip unzip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev cmake libffi-dev libssl-dev aidl libc6-i386 lib32stdc++6
        
    - name: Install Buildozer
      run: |
        pip3 install --user --upgrade buildozer cython virtualenv

    # 5. 开始终极打包（输出重定向到文件，防截断）
    - name: Build with Buildozer
      run: |
        export PATH=$PATH:~/.local/bin
        cd ${{ env.APP_ROOT }}
        cp $GITHUB_WORKSPACE/buildozer.spec .
        rm -rf .buildozer
        
        set -o pipefail
        yes | buildozer -v android debug > build.log 2>&1 || {
          echo "❌ 构建失败，最后 50 行日志："
          tail -n 50 build.log
          exit 1
        }

    # 6. 上传 APK
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: Typhoon-Sim-V1.4.4-APK
        path: ./build_dir/**/bin/*.apk
