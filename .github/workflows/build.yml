name: Build APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    # 1. 下载并解压你的原版包
    - name: Download and Unzip App
      run: |
        wget "https://github.com/Mtfghhg/TyphoonApp/releases/download/v1.0/Typhoon_sim1.3.3.zip" -O app.zip
        unzip -q app.zip -d ./build_dir
        rm app.zip
        
        # 智能寻路：找到真实的根目录
        MAIN_PATH=$(find ./build_dir -name "main.py" | head -n 1)
        if [ -z "$MAIN_PATH" ]; then
          echo "找不到 main.py"
          exit 1
        fi
        APP_ROOT=$(dirname "$MAIN_PATH")
        echo "找到核心目录: $APP_ROOT"
        echo "APP_ROOT=$APP_ROOT" >> $GITHUB_ENV

    # 2. 【核心救命补丁】：强行替换原版 main.py，适配手机触摸
    - name: Patch Mobile Main.py
      run: |
        cat << 'EOF' > ${{ env.APP_ROOT }}/main.py
        import os
        os.environ['SDL_VIDEODRIVER'] = 'dummy'
        os.environ['SDL_AUDIODRIVER'] = 'dummy'
        import pygame, sys
        sys.path.append(os.path.dirname(os.path.abspath(__file__)))
        pygame.init()
        try:
            import py.constants as constants
            from py.ty_sim import TySim
            infoObject = pygame.display.Info()
            sw, sh = infoObject.current_w, infoObject.current_h
            if sw == 0: sw, sh = 1920, 1080
            constants.SW, constants.SH = sw, sh
            constants.MH = constants.SH - constants.CPH
            screen = pygame.display.set_mode((sw, sh))
            sim = TySim(screen)
            clock = pygame.time.Clock()
            running = True
            while running:
                dt = clock.tick(30) / 1000.0
                for event in pygame.event.get():
                    if event.type == pygame.QUIT: running = False
                    elif event.type == pygame.FINGERDOWN:
                        mouse_event = pygame.event.Event(pygame.MOUSEBUTTONDOWN, {'pos': (event.x * sw, event.y * sh), 'button': 1})
                        sim.handle_event(mouse_event)
                    elif event.type == pygame.FINGERUP:
                        mouse_event = pygame.event.Event(pygame.MOUSEBUTTONUP, {'pos': (event.x * sw, event.y * sh), 'button': 1})
                        sim.handle_event(mouse_event)
                    else:
                        sim.handle_event(event)
                sim.update(dt)
                sim.draw(screen)
                pygame.display.flip()
            pygame.quit()
            os._exit(0)
        except Exception as e:
            print(f"崩溃原因: {e}")
        EOF

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Set up Java 17
      uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y git zip unzip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev cmake libffi-dev libssl-dev
        pip3 install --user --upgrade buildozer cython virtualenv

    # 3. 进入文件夹，一键打包
    - name: Build with Buildozer
      run: |
        export PATH=$PATH:~/.local/bin
        cd ${{ env.APP_ROOT }}
        cp $GITHUB_WORKSPACE/buildozer.spec .
        buildozer -v android debug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: Typhoon-APK
        path: ./build_dir/**/bin/*.apk
