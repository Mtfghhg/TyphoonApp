name: Build APK
on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 1. 显式设置 Java 环境，确保 Gradle 能找到它
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      # 2. 安装 Flutter 构建必需的 Linux 系统依赖
      - name: Install Linux Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev mesa-utils

      # 3. 安装 Flutter SDK
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      # 4. 强制执行 Android 许可证接受流程，避免 doctor 检查因许可证失败
      - name: Accept Android Licenses
        run: |
          yes | flutter doctor --android-licenses || true

      # 5. 安装 Python 依赖
      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 6. 核心修复：尝试跳过 flutter doctor 检查，直接开始构建
      - name: Build APK
        run: |
          flet build apk --no-rich-output --skip-flutter-doctor

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/apk/*.apk
          if-no-files-found: error
