name: Build APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    # 核心修正：用环境变量 CI: true 来自动确认交互
    env:
      CI: true
      GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4G -Dorg.gradle.daemon=false"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flet==0.24.1
          pip install -r requirements.txt

      - name: Build APK
        # 删掉了 --yes，只留 --no-rich-output
        run: flet build apk --no-rich-output

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/apk/*.apk
