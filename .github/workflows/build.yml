name: Build APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4g -Dorg.gradle.daemon=false"
    steps:
    - uses: actions/checkout@v4

    # 1. 下载并解压你的包
    - name: Download and Unzip App
      run: |
        wget "https://github.com/Mtfghhg/TyphoonApp/releases/download/v1.0/Typhoon_sim1.3.3.zip" -O app.zip
        unzip -q app.zip -d ./build_dir
        rm app.zip
        MAIN_PATH=$(find ./build_dir -name "main.py" | head -n 1)
        if [ -z "$MAIN_PATH" ]; then
          echo "❌ 找不到 main.py"
          exit 1
        fi
        APP_ROOT=$(dirname "$MAIN_PATH")
        echo "APP_ROOT=$APP_ROOT" >> $GITHUB_ENV

    # 2. 打触摸补丁
    - name: Patch Mobile Main.py
      run: python patch_main.py

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Set up Java 17
      uses: actions/setup-java@v5
      with:
        distribution: 'zulu'
        java-version: '17'

    # 3. 【核心修复】：强行补全系统缺失的 aidl 和协议
    - name: Fix Android SDK Environment
      run: |
        sudo apt-get update
        sudo apt-get install -y aidl libc6-i386 lib32stdc++6
        # 强制把许可协议写死进系统，解决 license not accepted
        echo "24333f8a63b6825ea9c5514f83c2829b004d1fee" > $ANDROID_HOME/licenses/android-sdk-license
        # 强行补装 build-tools
        $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "build-tools;30.0.3" || true

    - name: Install Buildozer
      run: |
        pip3 install --user --upgrade buildozer cython virtualenv

    - name: Build with Buildozer
      run: |
        export PATH=$PATH:~/.local/bin
        cd ${{ env.APP_ROOT }}
        cp $GITHUB_WORKSPACE/buildozer.spec .
        echo y | buildozer -v android debug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: Typhoon-APK
        path: ./build_dir/**/bin/*.apk
