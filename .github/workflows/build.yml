name: Build APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    steps:
    - uses: actions/checkout@v4

    - name: Download and Unzip App
      run: |
        wget "https://github.com/Mtfghhg/TyphoonApp/releases/download/v1.0/Typhoon_sim1.3.3.zip" -O app.zip
        unzip -q app.zip -d ./build_dir
        rm app.zip
        MAIN_PATH=$(find ./build_dir -name "main.py" | head -n 1)
        if [ -z "$MAIN_PATH" ]; then
          echo "❌ 严重错误：找不到 main.py"
          exit 1
        fi
        APP_ROOT=$(dirname "$MAIN_PATH")
        echo "✅ 找到核心目录: $APP_ROOT"
        echo "APP_ROOT=$APP_ROOT" >> $GITHUB_ENV

    - name: Patch Mobile Main.py
      run: python patch_main.py

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Set up Java 17
      uses: actions/setup-java@v5
      with:
        distribution: 'zulu'
        java-version: '17'

    # 👇 在系统依赖里加上 aidl
    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y git zip unzip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev cmake libffi-dev libssl-dev aidl
        pip3 install --user --upgrade buildozer cython virtualenv

    # 👇 在打包前，强制预先同意所有 SDK 许可协议
    - name: Accept Android SDK Licenses
      run: |
        export ANDROID_SDK_ROOT=$ANDROID_HOME
        mkdir -p $ANDROID_SDK_ROOT/licenses
        # 预创建许可文件，绕过交互式提示
        echo -e "\n8933bad161af4b6a5b573652ffc7aaf3aee85a47" > $ANDROID_SDK_ROOT/licenses/android-sdk-license
        echo -e "\nd56f5187479451eabf01fb78af6dfcb131b33910" > $ANDROID_SDK_ROOT/licenses/android-sdk-preview-license
        # 使用 sdkmanager 自动接受所有许可
        yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses 2>/dev/null || yes | $ANDROID_HOME/tools/bin/sdkmanager --licenses || true

    - name: Build with Buildozer
      run: |
        export PATH=$PATH:~/.local/bin
        cd ${{ env.APP_ROOT }}
        cp $GITHUB_WORKSPACE/buildozer.spec .
        # 👇 加上 echo y | 确保任何交互式提示都被自动回答 yes
        echo y | buildozer -v android debug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: Typhoon-APK
        path: ./build_dir/**/bin/*.apk
